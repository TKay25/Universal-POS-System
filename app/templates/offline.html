<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Offline · Universal POS</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6fb;
      --surface: #ffffff;
      --border: #e4e7f0;
      --text: #101322;
      --text-2: #4b5468;
      --primary: #5b5bd6;
    }
    @media (prefers-color-scheme: dark) {
      :root { color-scheme: dark; --bg: #0a0d16; --surface: #111624; --border: #232b3e; --text: #eef1f9; --text-2: #a8b2c8; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.5 "Inter", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    }
    .card {
      width: min(420px, 100%);
      padding: 32px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--surface);
      box-shadow: 0 32px 64px -24px rgba(16, 20, 34, .24);
      text-align: center;
    }
    .mark {
      width: 56px; height: 56px; margin: 0 auto 18px;
      display: grid; place-items: center;
      border-radius: 18px;
      background: linear-gradient(150deg, #6f6bea, #4a49c4);
    }
    h1 { margin: 0 0 8px; font-size: 20px; letter-spacing: -.02em; }
    p { margin: 0 0 22px; color: var(--text-2); }
    button {
      width: 100%;
      padding: 12px 16px;
      border: 0;
      border-radius: 12px;
      background: var(--primary);
      color: #fff;
      font: inherit;
      font-weight: 620;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: default; }
    .hint { margin: 14px 0 0; font-size: 12.5px; color: var(--text-2); }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="34" height="34" fill="none">
        <path fill="#fff" d="M5.06 5.91 L5.62 4.88 L6.19 5.91 L6.75 4.88 L7.31 5.91 L7.88 4.88 L8.44 5.91 L8.44 12.19 A3.56 3.56 0 0 0 15.56 12.19 L15.56 5.91 L16.12 4.88 L16.69 5.91 L17.25 4.88 L17.81 5.91 L18.38 4.88 L18.94 5.91 L18.94 12.19 A6.94 6.94 0 0 1 5.06 12.19 Z"/>
      </svg>
    </div>
    <h1>You are offline</h1>
    <p>Universal POS needs a connection to load sales, stock and reports. The app will pick up again as soon as your device is back online.</p>
    <button id="retry" type="button">Try again</button>
    <p class="hint" id="hint">Waiting for a connection…</p>
  </main>
  <script>
    const retry = document.getElementById("retry");
    const hint = document.getElementById("hint");
    retry.addEventListener("click", () => {
      retry.disabled = true;
      hint.textContent = "Reconnecting…";
      window.location.reload();
    });
    window.addEventListener("online", () => window.location.reload());
    if (navigator.onLine) {
      retry.disabled = false;
      hint.textContent = "Still offline? Check your Wi-Fi or mobile data.";
    }
  </script>
</body>
</html>
