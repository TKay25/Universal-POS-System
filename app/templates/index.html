<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Universal POS — a fully customisable cloud point of sale for every business.">
  <meta name="theme-color" content="#ffffff">
  <meta name="application-name" content="Universal POS">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Universal POS">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Universal POS</title>
  <script>
    /* Apply the last theme before paint so dark-mode users never get a white flash. */
    try {
      var savedTheme = localStorage.getItem("pos:theme");
      if (savedTheme === "dark" || savedTheme === "light") {
        document.documentElement.dataset.theme = savedTheme;
      }
    } catch (error) { /* private mode: keep the default theme */ }
  </script>
  <script>
    /* Capture the browser's install prompt before the module graph loads. */
    window.__posInstallPrompt = null;
    window.addEventListener("beforeinstallprompt", function (event) {
      event.preventDefault();
      window.__posInstallPrompt = event;
      window.dispatchEvent(new Event("pos:install-available"));
    });
    window.addEventListener("appinstalled", function () {
      window.__posInstallPrompt = null;
      window.dispatchEvent(new Event("pos:installed"));
    });
  </script>
  <link rel="manifest" href="{{ url_for('pwa_manifest') }}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%235b5bd6'/%3E%3Cpath d='M24 25v-1a8 8 0 0 1 16 0v1' fill='none' stroke='white' stroke-width='4.5' stroke-linecap='round'/%3E%3Crect x='18' y='24' width='28' height='26' rx='5' fill='white'/%3E%3C/svg%3E">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='icons/favicon-32.png') }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <div id="root">
    <div class="boot" role="status" aria-live="polite">
      <div class="boot__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 9V7a6 6 0 0 1 12 0v2"/>
          <rect x="4" y="9" width="16" height="12" rx="3"/>
          <path d="M9 14h6"/>
        </svg>
      </div>
      <div class="boot__name">Universal POS</div>
      <div class="boot__hint">Preparing your workspace…</div>
      <div class="boot__bar" aria-hidden="true"><span></span></div>
    </div>
  </div>
  <div class="toasts"></div>
  <noscript>
    <div style="padding:32px;font-family:system-ui">Universal POS needs JavaScript enabled in your browser.</div>
  </noscript>
  <script type="module" src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
