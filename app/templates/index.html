<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Universal POS — a fully customisable cloud point of sale for every business.">
  <meta name="theme-color" content="#ffffff">
  <meta name="application-name" content="Universal POS">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Universal POS">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Universal POS</title>
  <script>
    /* Apply the last theme before paint so dark-mode users never get a white flash. */
    try {
      var savedTheme = localStorage.getItem("pos:theme");
      if (savedTheme === "dark" || savedTheme === "light") {
        document.documentElement.dataset.theme = savedTheme;
      }
    } catch (error) { /* private mode: keep the default theme */ }
  </script>
  <script>
    /* Capture the browser's install prompt before the module graph loads. */
    window.__posInstallPrompt = null;
    window.addEventListener("beforeinstallprompt", function (event) {
      event.preventDefault();
      window.__posInstallPrompt = event;
      window.dispatchEvent(new Event("pos:install-available"));
    });
    window.addEventListener("appinstalled", function () {
      window.__posInstallPrompt = null;
      window.dispatchEvent(new Event("pos:installed"));
    });
  </script>
  <link rel="manifest" href="{{ url_for('pwa_manifest') }}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Cdefs%3E%3ClinearGradient%20id%3D%27g%27%20x1%3D%270%27%20y1%3D%270%27%20x2%3D%271%27%20y2%3D%271%27%3E%3Cstop%20offset%3D%270%27%20stop-color%3D%27%237c6cfa%27%2F%3E%3Cstop%20offset%3D%27.55%27%20stop-color%3D%27%235b5bd6%27%2F%3E%3Cstop%20offset%3D%271%27%20stop-color%3D%27%234034be%27%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2714.5%27%20fill%3D%27url%28%23g%29%27%2F%3E%3Cpath%20d%3D%27M13.5%2015.75%20L15%2013%20L16.5%2015.75%20L18%2013%20L19.5%2015.75%20L21%2013%20L22.5%2015.75%20L22.5%2032.5%20A9.5%209.5%200%200%200%2041.5%2032.5%20L41.5%2015.75%20L43%2013%20L44.5%2015.75%20L46%2013%20L47.5%2015.75%20L49%2013%20L50.5%2015.75%20L50.5%2032.5%20A18.5%2018.5%200%200%201%2013.5%2032.5%20Z%27%20fill%3D%27%23fff%27%2F%3E%3C%2Fsvg%3E">

  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>

    </div>
  </div>
  <div class="toasts"></div>
  <noscript>
    <div style="padding:32px;font-family:system-ui">Universal POS needs JavaScript enabled in your browser.</div>
  </noscript>

</html>
